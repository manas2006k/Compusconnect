
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillbridge
  labels:
    app: skillbridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillbridge
  template:
    metadata:
      labels:
        app: skillbridge
    spec:
      containers:
        - name: skillbridge
          image: ganeshg06/skillbridge:cca2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_SUPABASE_URL
              value: "https://eldmwjkolqqdhfqcawvg.supabase.co"
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: skillbridge-secrets
                  key: supabase-anon-key
